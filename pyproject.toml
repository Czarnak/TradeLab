[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TradeLab"
version = "0.1.0"
description = "A modular framework for backtesting trading strategies"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Łukasz Rafał Czarnacki", email = "czarnacki.lukasz.rafal@com" }
]
keywords = ["trading", "backtesting", "finance", "algorithmic-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
ml = [
    "tensorflow>=2.13",
    "keras>=2.13",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/Czarnak/TradeLab"
Repository = "https://github.com/Czarnak/TradeLab"
Issues = "https://github.com/Czarnak/TradeLab/issues"

[tool.hatch.build.targets.wheel]
packages = ["trade_lab"]