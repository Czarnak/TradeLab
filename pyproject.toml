[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TradeLab"
version = "0.8.0"
description = "A modular framework for backtesting trading strategies"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Łukasz Rafał Czarnacki", email = "czarnacki.lukasz.rafal@gmail.com" },
]
keywords = ["trading", "backtesting", "finance", "algorithmic-trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=3.0.1",
    "numpy>=2.4.2",
    "yfinance>=1.2.0",
    "plotly>=5.0",
    "optuna>=3.5",
]

[project.optional-dependencies]
ml = [
    "tensorflow>=2.20",
    "keras>=3.13",
    "optuna-integration[keras]>=4.5",
    "scikit-learn>=1.8",
    "lightgbm>=4.5",
]
mql5 = ["Jinja2>=3.1"]
onnx = ["Jinja2>=3.1", "tf2onnx>=1.16", "onnx>=1.15", "onnxruntime>=1.17"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "tqdm>=4.65", "ruff>=0.15.16"]
examples = ["nbformat>=4.2.0"]

[project.urls]
Homepage = "https://github.com/Czarnak/TradeLab"
Repository = "https://github.com/Czarnak/TradeLab"
Issues = "https://github.com/Czarnak/TradeLab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_lab"]
