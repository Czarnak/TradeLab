[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-lab"
version = "0.1.0"
description = "Desktop GUI integrating strategy backtesting, ML model building, and insider-trading scanning."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Market-Lab Contributors"}]

dependencies = [
    "PySide6>=6.6",
    "pandas>=2.1",
    "numpy>=1.25",
    "yfinance>=0.2.31",
    "optuna>=3.4",
    "matplotlib>=3.8",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "tenacity>=8.2",
    "tensorflow-cpu>=2.15",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-qt>=4.2",
    "responses>=0.24",
]

[project.scripts]
market-lab = "market_lab.main:main"
market-lab-cli = "market_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
