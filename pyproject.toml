[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TradeLab"
version = "0.6.0"
description = "A modular framework for backtesting trading strategies"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Łukasz Rafał Czarnacki", email = "czarnacki.lukasz.rafal@com" }
]
keywords = ["trading", "backtesting", "finance", "algorithmic-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=3.0.1",
    "numpy>=1.25",
    "yfinance>=1.2.0",
    "matplotlib>=3.7",
    "scipy>=1.17.1",
    "nbformat>=4.2.0",
    "optuna>=3.5",
]

[project.optional-dependencies]
ml = [
    "tensorflow>=2.20.0",
    "keras>=3.13",
    "optuna-integration[keras]>=4.5",
    "scikit-learn>=1.8",
]
mql5 = [
    "Jinja2>=3.1"
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "tqdm>=4.65",
]

[project.urls]
Homepage = "https://github.com/Czarnak/TradeLab"
Repository = "https://github.com/Czarnak/TradeLab"
Issues = "https://github.com/Czarnak/TradeLab/issues"

[tool.hatch.build.targets.wheel]
packages = ["trade_lab"]